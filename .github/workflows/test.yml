name: tests

# Every pull request, and main itself. Before this workflow existed a PR here
# ran zero checks, and /lc:done had to be told that was legitimate in this repo
# and nowhere else. That carve-out is gone: the rule "an empty rollup is not a
# pass" now means the same thing here as everywhere else.
on:
  pull_request:
  push:
    branches: [main]
  # Daily, for the release-tag job alone: a bump that merges with nothing on top
  # of it would otherwise never be checked again. 14:00 UTC, after a day's work.
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Minutes are a budget. A new push supersedes the run it replaced.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-python and no pip install: the plugin ships no requirements
      # file, the suite is stdlib only, and the runner's own python3 is the
      # closest thing to the interpreter a user will actually run it under.
      - name: Show interpreter
        run: python3 -VV

      # The literal command the README names, run against a clean checkout so
      # the documented path is the tested one. The suite covers this check too;
      # a step of its own makes drift read as a failed check named for what it
      # is, rather than as an assertion buried in 56 lines of unittest output.
      - name: Version records agree
        run: python3 -B tests/check_version_sync.py

      - name: Run the suite
        run: python3 -B -m unittest discover -s tests -t . -v

  # Is the version on main released? Decision 0002: every version that reaches
  # main gets an annotated v<version> tag. 0.9.1 went out without one, on the
  # procedure's first use. Never on a pull request: the tag is cut after merge,
  # so a bump PR cannot have one, and this would make every bump red by design.
  # On a push, a version new in that push passes with a reminder (--before); one
  # that was already on main must be tagged. See CONTRIBUTING, "Cutting a release".
  release-tag:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 brings every tag and the pre-push commit. The default
      # checkout fetches no tags, and the check would fail on every run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Released version is tagged
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [ -n "$BEFORE" ]; then
            python3 -B tests/check_release_tag.py --before "$BEFORE"
          else
            python3 -B tests/check_release_tag.py
          fi
